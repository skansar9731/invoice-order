<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Base -->
  <rect width="512" height="512" rx="100" fill="url(#bg-grad)" />
  <rect x="20" y="20" width="472" height="472" rx="80" fill="none" stroke="#334155" stroke-width="4" />
  
  <!-- Outer Gear Ring -->
  <g transform="translate(256, 256)">
    <!-- Gear Teeth -->
    <path d="M-30,-180 L30,-180 L25,-140 L-25,-140 Z" fill="url(#accent-grad)" />
    <path d="M-30,-180 L30,-180 L25,-140 L-25,-140 Z" fill="url(#accent-grad)" transform="rotate(45)" />
    <path d="M-30,-180 L30,-180 L25,-140 L-25,-140 Z" fill="url(#accent-grad)" transform="rotate(90)" />
    <path d="M-30,-180 L30,-180 L25,-140 L-25,-140 Z" fill="url(#accent-grad)" transform="rotate(135)" />
    <path d="M-30,-180 L30,-180 L25,-140 L-25,-140 Z" fill="url(#accent-grad)" transform="rotate(180)" />
    <path d="M-30,-180 L30,-180 L25,-140 L-25,-140 Z" fill="url(#accent-grad)" transform="rotate(225)" />
    <path d="M-30,-180 L30,-180 L25,-140 L-25,-140 Z" fill="url(#accent-grad)" transform="rotate(270)" />
    <path d="M-30,-180 L30,-180 L25,-140 L-25,-140 Z" fill="url(#accent-grad)" transform="rotate(315)" />

    <!-- Gear Body -->
    <circle r="145" fill="url(#accent-grad)" />
    <circle r="105" fill="#0f172a" />
    
    <!-- Central Document / Note Symbol -->
    <rect x="-50" y="-60" width="100" height="120" rx="8" fill="#f8fafc" />
    <line x1="-30" y1="-30" x2="30" y2="-30" stroke="#0f172a" stroke-width="6" stroke-linecap="round" />
    <line x1="-30" y1="-10" x2="30" y2="-10" stroke="#0f172a" stroke-width="6" stroke-linecap="round" />
    <line x1="-30" y1="10" x2="10" y2="10" stroke="#0f172a" stroke-width="6" stroke-linecap="round" />
    <circle cx="20" cy="30" r="12" fill="#10b981" />
    <path d="M16,30 L19,33 L25,27" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
